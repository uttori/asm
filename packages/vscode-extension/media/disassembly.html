<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Disassembly</title>
  </head>
  <body>
    <p id="trustNotice" class="notice" hidden>
      Trust this workspace to edit annotations, regenerate source, or capture execution.
    </p>
    <p id="actionStatus" class="action-status" role="status" aria-live="polite" hidden></p>
    <main>
      <section class="section" aria-label="Source tools">
        <button class="primary full" data-cmd="regenerateDisassembly" data-trusted>
          Analyze & Regenerate
        </button>
        <p class="hint">
          Update source from saved annotations and trace evidence. Verify the ROM round trip.
        </p>
        <div class="button-grid">
          <button data-cmd="editAnnotation" data-trusted>Edit Annotation</button>
          <button data-cmd="openRamMap" data-trusted>RAM Map</button>
        </div>
        <button class="quiet" data-cmd="disassemblyStatus">Check Source Status</button>
      </section>

      <details id="captureSection">
        <summary>Runtime Capture</summary>
        <div class="section-content">
          <p class="hint">Record a session and identify the routines that ran.</p>
          <div class="button-grid">
            <button data-cmd="startExecutionCapture" data-trusted>Start Recording</button>
            <button data-cmd="stopExecutionCapture" data-trusted>Stop & Analyze</button>
          </div>
          <button class="full" data-cmd="importRuntimeTrace" data-trusted>
            Import Saved Trace
          </button>
        </div>
      </details>
    </main>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Assembly Project</title>
  </head>
  <body>
    <header class="project-header">
      <div class="heading-row">
        <strong id="projectName">Assembly Project</strong>
        <button
          class="quiet"
          data-cmd="refresh"
          title="Refresh project status"
          aria-label="Refresh project status">
          ↻
        </button>
      </div>
    </header>
    <p id="trustNotice" class="notice" hidden>Trust this workspace to edit project settings.</p>
    <p id="actionStatus" class="action-status" role="status" aria-live="polite" hidden></p>
    <main>
      <details id="settingsSection" open>
        <summary>Project Settings <span class="detail-hint">Build & Paths</span></summary>
        <div class="section-content">
          <button class="full" id="configAction" data-cmd="initConfig" data-trusted>
            Initialize Project Configuration
          </button>
          <label for="target">Target</label>
          <select id="target" data-trusted></select>
          <label for="architecture">Architecture</label>
          <select id="architecture" data-trusted></select>
          <label for="buildOutput">Build Output</label>
          <input id="buildOutput" placeholder="game.sfc" data-trusted />
          <h3>Entry points</h3>
          <div class="list" id="entryPoints"></div>
          <button class="quiet" data-cmd="addEntryPoint" data-trusted>Add File…</button>
          <h3>Include paths</h3>
          <div class="list" id="includePaths"></div>
          <button class="quiet" data-cmd="addIncludePath" data-trusted>Add Folder…</button>
        </div>
      </details>

      <details id="diagnosticsSection">
        <summary>Index Details</summary>
        <dl class="status section-content" id="status"></dl>
      </details>
    </main>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>Uttori Home</title>
  </head>
  <body>
    <!-- Keep the live region mounted so assistive technology observes later message updates. -->
    <p
      id="actionStatus"
      class="home-status"
      role="status"
      aria-live="polite"
      aria-atomic="true"></p>
    <main id="root" tabindex="-1" aria-label="Project home"></main>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
